services:
  api:
    # Multi-arch image published to Docker Hub. Rebuild/push via
    # `scripts/docker-push.sh`; compose itself never builds.
    image: igorwang/wechat-oap-api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: wechat-oap-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override so the cache lives on the mounted volume (see below).
      WECHAT_TOKEN_CACHE_PATH: /data/.wechat_token.json
      # Same for the 微信客服 sync_msg cursor — if it lived in the image's
      # working dir it would reset on every recreate, re-pulling old messages
      # and replying to them a second time.
      CS_CURSOR_PATH: /data/.cs_cursor.json
      # 落盘日志。/data 是命名卷（宿主机看不到），所以日志目录单独 bind 出来，
      # 方便直接 tail/grep ./data/log/app.log 排查。
      LOG_DIR: /data/log
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wechat}:${POSTGRES_PASSWORD:-wechat}@db:5432/${POSTGRES_DB:-wechat}
    depends_on:
      db:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Persist the WeChat access_token across restarts so we don't
      # needlessly burn through /cgi-bin/token quota.
      - token-cache:/data
      # 嵌套挂载：/data 走命名卷，/data/log 单独绑到宿主机目录
      - ./data/log:/data/log
      # 私有群二维码留在宿主机，应用只读。
      - ./data/customer-service:/data/customer-service:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)
      interval: 30s
      timeout: 3s
      # 启动时要同步一次公众号关注者名单（上限 30s），给足宽限期
      start_period: 45s
      retries: 3

  # 绑出去的日志目录由 Docker 以 root 建，而 api 跑在 uid 10001 上，直接写会
  # PermissionError。起容器前先把属主改过来，免得每换一台宿主机都要手动 chown。
  # 复用 api 镜像避免多拉一个 busybox。
  log-init:
    image: igorwang/wechat-oap-api:${IMAGE_TAG:-latest}
    container_name: wechat-oap-log-init
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /data/log && chown -R 10001:10001 /data/log"]
    volumes:
      - ./data/log:/data/log
    restart: "no"

  db:
    image: postgres:17-alpine
    container_name: wechat-oap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wechat}
      POSTGRES_DB: ${POSTGRES_DB:-wechat}
    volumes:
      # Bind mount so the data is visible on the host for backup/inspection.
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wechat} -d ${POSTGRES_DB:-wechat}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  token-cache:
